[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uavguide"
version = "0.1.0"
description = "Fixed-wing UAV path planning, L1 guidance and target approach simulation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gürkan Kılınç" }]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["uavguide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
